name: Build and deploy Spotisee

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/christianharris-3/spotisee-backend
  FRONTEND_IMAGE: ghcr.io/christianharris-3/spotisee-frontend

concurrency:
  group: spotisee-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare image tag
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Generate branch image tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9._-]/-/g' \
            | sed 's/^-*//' \
            | cut -c1-128)"

          if [ -z "$IMAGE_TAG" ]; then
            echo "Could not generate a valid image tag."
            exit 1
          fi

          echo "Using image tag: $IMAGE_TAG"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build backend
    needs:
      - prepare

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish backend
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ needs.prepare.outputs.image_tag }}
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=spotisee-backend
          cache-to: type=gha,mode=max,scope=spotisee-backend

  build-frontend:
    name: Build frontend
    needs:
      - prepare

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ needs.prepare.outputs.image_tag }}
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=spotisee-frontend
          cache-to: type=gha,mode=max,scope=spotisee-frontend

  deploy:
    name: Deploy master
    needs:
      - prepare
      - build-backend
      - build-frontend

    if: github.ref_name == 'master'

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure SSH
        shell: bash
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_SSH_HOST_KEY: ${{ secrets.SERVER_SSH_HOST_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SERVER_SSH_KEY" > "$HOME/.ssh/spotisee"
          chmod 600 "$HOME/.ssh/spotisee"

          printf '%s\n' "$SERVER_SSH_HOST_KEY" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Create deployment directories
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/spotisee" \
            -p "${SERVER_PORT:-22}" \
            "${SERVER_USER}@${SERVER_HOST}" \
            "mkdir -p /opt/spotisee/backend/src/main/resources"

      - name: Copy deployment files
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          scp \
            -i "$HOME/.ssh/spotisee" \
            -P "${SERVER_PORT:-22}" \
            compose.yml \
            "${SERVER_USER}@${SERVER_HOST}:/opt/spotisee/compose.yml"

          scp \
            -i "$HOME/.ssh/spotisee" \
            -P "${SERVER_PORT:-22}" \
            backend/src/main/resources/db.sql \
            "${SERVER_USER}@${SERVER_HOST}:/opt/spotisee/backend/src/main/resources/db.sql"

      - name: Log the server into GHCR
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          printf '%s' "$GHCR_TOKEN" |
            ssh \
              -i "$HOME/.ssh/spotisee" \
              -p "${SERVER_PORT:-22}" \
              "${SERVER_USER}@${SERVER_HOST}" \
              "docker login ghcr.io --username '${{ github.actor }}' --password-stdin"

      - name: Deploy application
        shell: bash
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/spotisee" \
            -p "${SERVER_PORT:-22}" \
            "${SERVER_USER}@${SERVER_HOST}" \
            'set -e
             cd /opt/spotisee

             export BACKEND_TAG=master
             export FRONTEND_TAG=master

             docker compose pull backend frontend
             docker compose up -d --remove-orphans
             docker compose ps
             docker image prune -f'
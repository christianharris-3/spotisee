name: Build and deploy Spotisee

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

concurrency:
  group: spotisee-production
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      deployment: ${{ steps.filter.outputs.deployment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - "backend/**"
              - ".github/workflows/deploy.yml"

            frontend:
              - "frontend/**"
              - ".github/workflows/deploy.yml"

            deployment:
              - "compose.yml"
              - ".github/workflows/deploy.yml"

  build-backend:
    name: Build backend image
    needs: changes

    if: needs.changes.outputs.backend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/christianharris-3/spotisee-backend:master
            ghcr.io/christianharris-3/spotisee-backend:${{ github.sha }}
          cache-from: type=gha,scope=spotisee-backend
          cache-to: type=gha,mode=max,scope=spotisee-backend

  build-frontend:
    name: Build frontend image
    needs: changes

    if: needs.changes.outputs.frontend == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/christianharris-3/spotisee-frontend:master
            ghcr.io/christianharris-3/spotisee-frontend:${{ github.sha }}
          cache-from: type=gha,scope=spotisee-frontend
          cache-to: type=gha,mode=max,scope=spotisee-frontend

  deploy:
    name: Deploy production
    needs:
      - changes
      - build-backend
      - build-frontend

    if: |
      always() &&
      needs.changes.result == 'success' &&
      (
        needs.build-backend.result == 'success' ||
        needs.build-backend.result == 'skipped'
      ) &&
      (
        needs.build-frontend.result == 'success' ||
        needs.build-frontend.result == 'skipped'
      ) &&
      (
        needs.changes.outputs.backend == 'true' ||
        needs.changes.outputs.frontend == 'true' ||
        needs.changes.outputs.deployment == 'true'
      )

    runs-on:
      - self-hosted
      - linux
      - spotisee-production

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Create deployment directory
        run: mkdir -p /opt/spotisee

      - name: Install current Compose file
        run: cp compose.yml /opt/spotisee/compose.yml

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull current images
        working-directory: /opt/spotisee
        run: docker compose pull backend frontend

      - name: Deploy
        working-directory: /opt/spotisee
        run: docker compose up -d --remove-orphans

      - name: Show deployment status
        working-directory: /opt/spotisee
        run: docker compose ps

      - name: Remove unused images
        run: docker image prune -f
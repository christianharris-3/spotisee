name: spotisee

services:
  database:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: Spotisee
      MYSQL_USER: spotisee
      MYSQL_PASSWORD: spotisee-password
      MYSQL_ROOT_PASSWORD: change-this-root-password

    volumes:
      - spotisee-database:/var/lib/mysql
      - ./backend/src/main/resources/db.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    networks:
      - spotisee

  backend:
    image: ghcr.io/christianharris-3/spotisee-backend:master
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    expose:
      - "8080"
      - "8081"

    networks:
      - spotisee

  frontend:
    image: ghcr.io/christianharris-3/spotisee-frontend:master
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "8088:80"

    networks:
      - spotisee

volumes:
  spotisee-database:

networks:
  spotisee:
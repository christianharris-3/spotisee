services:
  database:
    image: mysql:8.4
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Spotisee}
      MYSQL_USER: ${MYSQL_USER:-spotisee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spotisee-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-password}

    volumes:
      - spotisee-database:/var/lib/mysql
      - ./backend/src/main/resources/db.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    image: ghcr.io/christianharris-3/spotisee-backend:${BACKEND_TAG:-master}
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Spotisee}
      MYSQL_USER: ${MYSQL_USER:-spotisee}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-spotisee-password}

    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: ghcr.io/christianharris-3/spotisee-frontend:${FRONTEND_TAG:-master}
    restart: unless-stopped

    ports:
      - "8088:80"

    networks:
      - spotisee

volumes:
  spotisee-database:

networks:
  spotisee: